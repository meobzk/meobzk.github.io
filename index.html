<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android Setup Hub</title>
<style>
    body{font-family:Arial;background:#eef2f5;max-width:900px;margin:auto;padding:16px}
    .card{background:#fff;border-radius:12px;padding:16px;margin:12px 0}
    .row{display:flex;gap:4px;align-items:center;margin:6px 0}
    .grow{flex:1}
    input,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px}
    button{background:#1677ff;color:#fff;border:0;border-radius:6px;padding:8px 8px;cursor:pointer;white-space:nowrap;font-size:12px}
    .check-btn{background:#fff;border:1px solid #ccc;width:38px;height:35px;font-size:18px;border-radius:6px;cursor:pointer}
    .checked{background:#d4edda;border-color:#28a745}
    .linkbox{border:1px solid #ddd;border-radius:10px;padding:10px;margin:10px 0}
    summary{cursor:pointer;font-weight:bold;padding:10px;background:#f9f9f9;border-radius:8px}
    .num-label{width:30px;font-size:12px;color:#666;flex-shrink:0;text-align:center}
</style>
</head>
<body>

<div class="card">
    <h2>Android Setup Hub</h2>
    <div id="cnt"></div>
    <div id="emails"></div>
</div>

<div class="card">
    <h3>📥 Cập nhật mail</h3>
    <textarea id="bulk" rows="4" placeholder="email|password (Tối đa 10 dòng)"></textarea>
    <div style="margin-top:10px">
        <button id="btn-update">Cập nhật Mail</button>
        <button id="btn-reset-mail" style="background:#666">Reset Mail</button>
    </div>
</div>

<div class="card">
    <h3>🔑 Password chung</h3>
    <input id="pwd" placeholder="Password chung">
    <button style="margin-top:10px" id="btn-copy-pwd">📋 Copy Password</button>
</div>

<!-- 10 LINK GIFTUTO -->
<div class="card">
    <details>
        <summary>🎁 10 Link Giftuto</summary>
        <div id="giftutoContainer" style="margin-top:10px"></div>
    </details>
</div>

<!-- 10 LINK NHANH -->
<div class="card">
    <details>
        <summary>🔗 10 Link nhanh</summary>
        <div id="linksContainer"></div>
    </details>
</div>

<!-- MỤC WIFI 4 CỘT -->
<div class="card">
    <details>
        <summary>📶 31 WiFi (4 Cột: 2x 2.4G & 2x 5G)</summary>
        <div id="wifiContainer" style="margin-top:10px"></div>
    </details>
</div>

<!-- MỤC 200 ACCOUNT -->
<div class="card">
    <details>
        <summary>👤 200 Account (2 Cột Tích ✅)</summary>
        <div style="display:flex; gap:6px; margin:10px 0; flex-wrap:wrap;">
            <button id="btn-copy-all-names" style="background:#28a745; flex:1; min-width:140px;">📋 Copy tất cả Tên</button>
            <button id="btn-reset-acc1" style="background:#faad14; flex:1; min-width:140px;">Reset Tích Cột 1 🔄</button>
            <button id="btn-reset-acc2" style="background:#ff4d4f; flex:1; min-width:140px;">Reset Tích Cột 2 🔄</button>
        </div>
        <div id="accContainer"></div>
    </details>
</div>

<!-- MỤC 1000 ACC -->
<div class="card">
    <details>
        <summary>👤 1000 Acc</summary>
        <div style="display:flex; gap:8px; margin:10px 0;">
            <button id="btn-copy-all-1000" style="background:#28a745; flex:1;">📋 Copy tất cả Tên 1000 Acc</button>
            <button id="btn-reset-1000" style="background:#ff4d4f; flex:1;">Reset tất cả dấu tích ✅</button>
        </div>
        <div id="acc1000Container"></div>
    </details>
</div>

<div class="card">
    <h3>📝 Ghi chú</h3>
    <textarea id="note" rows="4"></textarea>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAXwW5V-Yfs4wVFZpM7Z2uKJQjl_BC5tHw",
    databaseURL: "https://meobzk-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meobzk"
};
const db = getDatabase(initializeApp(firebaseConfig));
const hubRef = ref(db, 'hub');

const wifi24List1 = [
    "Cafe Hana", "Kissa Sakura", "Tokyo Coffee", "Matcha Hub", "Nihon Cafe",
    "Osaka Roastery", "Kyoto Brew", "Yuki Cafe", "Sora Coffee", "Mori Cafe",
    "Haru Stand", "Natsu Brew", "Aki Coffee", "Fuyu Lounge", "Zen Cafe",
    "Neon Tokyo", "Shibuya Beans", "Shinjuku Cup", "Akiba Cafe", "Ginza Roast",
    "Roppongi Brew", "Asakusa Coffee", "Fuji View", "Matcha House", "Ueno Beans",
    "Hokkaido Cup", "Okinawa Chill", "Nagoya Roast", "Sendai Coffee", "Kobe Lounge", "Nippon Cafe"
];

const wifi24List2 = [
    "Cafe Lumiere", "Kissa Retro", "Chiyoda Brew", "Sencha Bar", "Honshu Bean",
    "Matsue Roast", "Takamatsu Cup", "Aomori Cafe", "Niigata Chill", "Sakai Lounge",
    "Kawasaki Roast", "Sagamihara Cup", "Hamamatsu Brew", "Okayama Cafe", "Kumamoto Chill",
    "Kagoshima Bean", "Funabashi Stand", "Hachioji Roast", "Himeji Lounge", "Matsuyama Cup",
    "Utsunomiya Cafe", "Kanazawa Brew", "Oita Chill", "Nagasaki Roast", "Yokosuka Bean",
    "Toyama Cup", "Naha Lounge", "Miyazaki Cafe", "Iwate Roast", "Shiga Brew", "Nihonbashi Hub"
];

const wifi5List1 = [
    "Cafe Mugi", "Kissa Machi", "Edo Coffee", "Sencha Hub", "Honshu Cafe",
    "Hakata Roastery", "Nara Brew", "Hoshi Cafe", "Kaze Coffee", "Tori Cafe",
    "Kura Stand", "Yama Brew", "Tsuki Coffee", "Umi Lounge", "Miso Cafe",
    "Cyber Tokyo", "Kanagawa Beans", "Chiba Cup", "Saitama Cafe", "Fukuoka Roast",
    "Yokohama Brew", "Hiroshima Coffee", "Sapporo View", "Oita House", "Kumamoto Beans",
    "Nagano Cup", "Shizuoka Chill", "Gunma Roast", "Tochigi Coffee", "Ibaraki Lounge", "Akita Cafe"
];

const wifi5List2 = [
    "Cafe Nova", "Kissa Sol", "Minato Brew", "Matcha Lab", "Kansai Roast",
    "Chiba Hub", "Saitama Lounge", "Ibaraki Cup", "Gifu Cafe", "Yamaguchi Chill",
    "Nagano Bean", "Gunma Stand", "Tochigi Roast", "Fukushima Lounge", "Miyagi Cup",
    "Shiga Cafe", "Ehime Brew", "Kochi Chill", "Saga Roast", "Yamagata Bean",
    "Tokushima Cup", "Kagawa Lounge", "Fukui Cafe", "Wakayama Brew", "Yamanashi Chill",
    "Hyogo Roast", "Aichi Bean", "Shizuoka Cup", "Hokkaido Lounge", "Kyushu Cafe", "Tokyo Station"
];

let state = { mails:[], used:[], giftutos:[], links:[], wifis:[], accounts:[], accounts1000:[], pwd:"", note:"" };

onValue(hubRef, (snap) => {
    const data = snap.val() || {};
    state.mails = data.mails || Array(10).fill("");
    state.used = data.used || Array(10).fill(false);
    state.giftutos = data.giftutos || Array(10).fill("");
    state.links = data.links || Array.from({length: 10}, (_,i) => ({name: "Link "+(i+1), url: ""}));
    
    let loadedWifis = data.wifis || [];
    state.wifis = Array.from({length: 31}, (_, i) => {
        let item = loadedWifis[i] || {};
        return { 
            w24_1: item.w24_1 && item.w24_1 !== "undefined" ? item.w24_1 : wifi24List1[i], 
            w24_2: item.w24_2 && item.w24_2 !== "undefined" ? item.w24_2 : wifi24List2[i], 
            w5_1: item.w5_1 && item.w5_1 !== "undefined" ? item.w5_1 : wifi5List1[i], 
            w5_2: item.w5_2 && item.w5_2 !== "undefined" ? item.w5_2 : wifi5List2[i] 
        };
    });

    let loadedAccs = data.accounts || [];
    state.accounts = Array.from({length: 200}, (_, i) => {
        return loadedAccs[i] || { name: "", pass: "", checked1: false, checked2: false };
    });

    let loadedAccs1000 = data.accounts1000 || [];
    state.accounts1000 = Array.from({length: 1000}, (_, i) => {
        return loadedAccs1000[i] || { name: "", pass: "", checked: false };
    });
    
    if(document.activeElement.id !== "pwd") pwd.value = data.pwd || "";
    if(document.activeElement.id !== "note") note.value = data.note || "";
    render();
});

function render() {
    const activeId = document.activeElement ? document.activeElement.id : null;
    
    // 1. Render Mail
    emails.innerHTML = ""; cnt.textContent = "Đã dùng: " + state.used.filter(x=>x).length + "/10";
    state.mails.forEach((m,i) => {
        let r = document.createElement("div"); r.className = "row";
        r.innerHTML = `<div class="grow"><b>Mail ${i+1}</b> ${state.used[i] ? "✅" : ""}<br>${m||"(trống)"}</div>`;
        let b = document.createElement("button"); b.textContent = "Copy";
        b.onclick = () => { 
            if(m) navigator.clipboard.writeText(m); 
            state.used[i] = !state.used[i]; 
            update(hubRef, {used: state.used}); 
        };
        r.appendChild(b); emails.appendChild(r);
    });

    // 2. Render Giftuto
    giftutoContainer.innerHTML = "";
    state.giftutos.forEach((gUrl, i) => {
        let div = document.createElement("div"); div.className = "row";
        let lbl = document.createElement("span"); lbl.className = "num-label"; lbl.textContent = i+1;
        let input = document.createElement("input"); input.value = gUrl; input.className = "grow"; input.placeholder = "Link Giftuto " + (i+1); input.id = "gf_"+i;
        input.oninput = (e) => { state.giftutos[i] = e.target.value; update(hubRef, {giftutos: state.giftutos}); };
        
        let bOpen = document.createElement("button"); bOpen.textContent = "🌐 Mở"; bOpen.style.background = "#52c41a";
        bOpen.onclick = () => { if(gUrl) window.open(gUrl, "_blank"); };

        let bDel = document.createElement("button"); bDel.textContent = "❌ Xóa"; bDel.style.background = "#ff4d4f";
        bDel.onclick = () => { state.giftutos[i] = ""; update(hubRef, {giftutos: state.giftutos}); };

        div.append(lbl, input, bOpen, bDel);
        giftutoContainer.appendChild(div);
    });

    // 3. Render 10 Links nhanh
    linksContainer.innerHTML = "";
    state.links.forEach((l,i) => {
        let box = document.createElement("div"); box.className = "linkbox";
        let n = document.createElement("input"); n.value = l.name; n.id = "ln"+i; n.oninput = (e)=>{state.links[i].name=e.target.value; update(hubRef, {links:state.links});};
        let u = document.createElement("input"); u.value = l.url; u.id = "lu"+i; u.style.marginTop="5px"; u.oninput = (e)=>{state.links[i].url=e.target.value; update(hubRef, {links:state.links});};
        let b = document.createElement("button"); b.textContent="Mở"; b.style.marginTop="8px"; b.onclick=()=>{if(l.url) window.open(l.url,"_blank")};
        box.append(n, u, b); linksContainer.appendChild(box);
    });

    // 4. Render 31 WiFi (4 Cột)
    wifiContainer.innerHTML = "";
    state.wifis.forEach((wf, i) => {
        let div = document.createElement("div"); div.className = "row";
        let lbl = document.createElement("span"); lbl.className = "num-label"; lbl.textContent = i+1;
        
        let i1 = document.createElement("input"); i1.value = wf.w24_1; i1.className = "grow"; i1.placeholder = "2.4G-1"; i1.id = "w24_1_"+i;
        i1.oninput = (e) => { state.wifis[i].w24_1 = e.target.value; update(hubRef, {wifis: state.wifis}); };
        let b1 = document.createElement("button"); b1.textContent = "📋"; b1.style.background = "#52c41a";
        b1.onclick = () => navigator.clipboard.writeText(wf.w24_1);

        let i2 = document.createElement("input"); i2.value = wf.w24_2; i2.className = "grow"; i2.placeholder = "2.4G-2"; i2.id = "w24_2_"+i;
        i2.oninput = (e) => { state.wifis[i].w24_2 = e.target.value; update(hubRef, {wifis: state.wifis}); };
        let b2 = document.createElement("button"); b2.textContent = "📋"; b2.style.background = "#13c2c2";
        b2.onclick = () => navigator.clipboard.writeText(wf.w24_2);

        let i3 = document.createElement("input"); i3.value = wf.w5_1; i3.className = "grow"; i3.placeholder = "5G-1"; i3.id = "w5_1_"+i;
        i3.oninput = (e) => { state.wifis[i].w5_1 = e.target.value; update(hubRef, {wifis: state.wifis}); };
        let b3 = document.createElement("button"); b3.textContent = "📋"; b3.style.background = "#722ed1";
        b3.onclick = () => navigator.clipboard.writeText(wf.w5_1);

        let i4 = document.createElement("input"); i4.value = wf.w5_2; i4.className = "grow"; i4.placeholder = "5G-2"; i4.id = "w5_2_"+i;
        i4.oninput = (e) => { state.wifis[i].w5_2 = e.target.value; update(hubRef, {wifis: state.wifis}); };
        let b4 = document.createElement("button"); b4.textContent = "📋"; b4.style.background = "#eb2f96";
        b4.onclick = () => navigator.clipboard.writeText(wf.w5_2);

        div.append(lbl, i1, b1, i2, b2, i3, b3, i4, b4);
        wifiContainer.appendChild(div);
    });

    // 5. Render 200 Accounts
    accContainer.innerHTML = "";
    state.accounts.forEach((acc, i) => {
        let div = document.createElement("div"); div.className = "row";
        
        let n = document.createElement("input"); n.value = acc.name; n.className = "grow"; n.placeholder = "Tên"; n.id = "n"+i; 
        n.oninput = (e)=>{ state.accounts[i].name = e.target.value; update(hubRef, {accounts:state.accounts}); };
        let c1 = document.createElement("button"); c1.textContent="📋"; c1.onclick=()=>navigator.clipboard.writeText(acc.name);
        
        let p = document.createElement("input"); p.value = acc.pass; p.style.width="70px"; p.placeholder = "Pass"; p.id = "p"+i;
        p.oninput = (e)=>{ state.accounts[i].pass = e.target.value; update(hubRef, {accounts:state.accounts}); };
        let c2 = document.createElement("button"); c2.textContent="📋"; c2.onclick=()=>navigator.clipboard.writeText(acc.pass);

        let chk1 = document.createElement("button"); chk1.className = "check-btn " + (acc.checked1 ? "checked" : "");
        chk1.innerHTML = acc.checked1 ? "✅" : "";
        chk1.onclick = () => { state.accounts[i].checked1 = !state.accounts[i].checked1; update(hubRef, {accounts: state.accounts}); };

        let chk2 = document.createElement("button"); chk2.className = "check-btn " + (acc.checked2 ? "checked" : "");
        chk2.innerHTML = acc.checked2 ? "✅" : "";
        chk2.onclick = () => { state.accounts[i].checked2 = !state.accounts[i].checked2; update(hubRef, {accounts: state.accounts}); };

        div.innerHTML = `<span class="num-label">${i+1}</span>`;
        div.append(n, c1, p, c2, chk1, chk2);
        accContainer.appendChild(div);
    });

    // 6. Render 1000 Accounts
    acc1000Container.innerHTML = "";
    state.accounts1000.forEach((acc, i) => {
        let div = document.createElement("div"); div.className = "row";
        let n = document.createElement("input"); n.value = acc.name; n.className = "grow"; n.placeholder = "Tên"; n.id = "n1000_"+i; 
        n.oninput = (e)=>{ state.accounts1000[i].name = e.target.value; update(hubRef, {accounts1000:state.accounts1000}); };
        let c1 = document.createElement("button"); c1.textContent="📋"; c1.onclick=()=>navigator.clipboard.writeText(acc.name);
        let p = document.createElement("input"); p.value = acc.pass; p.style.width="70px"; p.placeholder = "Pass"; p.id = "p1000_"+i;
        p.oninput = (e)=>{ state.accounts1000[i].pass = e.target.value; update(hubRef, {accounts1000:state.accounts1000}); };
        let c2 = document.createElement("button"); c2.textContent="📋"; c2.onclick=()=>navigator.clipboard.writeText(acc.pass);
        let c = document.createElement("button"); c.className = "check-btn " + (acc.checked ? "checked" : "");
        c.innerHTML = acc.checked ? "✅" : "";
        c.onclick = () => { state.accounts1000[i].checked = !state.accounts1000[i].checked; update(hubRef, {accounts1000: state.accounts1000}); };
        div.innerHTML = `<span class="num-label" style="width:45px">${i+1}</span>`;
        div.append(n, c1, p, c2, c);
        acc1000Container.appendChild(div);
    });

    if(activeId && document.getElementById(activeId)) document.getElementById(activeId).focus();
}

document.getElementById("btn-update").onclick = () => { state.mails = bulk.value.split("\n").filter(Boolean).slice(0,10); update(hubRef, {mails: state.mails, used: Array(10).fill(false)}); bulk.value=""; };
document.getElementById("btn-reset-mail").onclick = () => update(hubRef, {used: Array(10).fill(false)});

document.getElementById("btn-copy-all-names").onclick = () => {
    let allNames = state.accounts.map(acc => acc.name || "").join("\n");
    navigator.clipboard.writeText(allNames).then(() => alert("Đã copy toàn bộ tên của 200 account!"));
};

document.getElementById("btn-reset-acc1").onclick = () => {
    let newAccs = state.accounts.map(a => ({...a, checked1: false}));
    update(hubRef, {accounts: newAccs});
};

document.getElementById("btn-reset-acc2").onclick = () => {
    let newAccs = state.accounts.map(a => ({...a, checked2: false}));
    update(hubRef, {accounts: newAccs});
};

document.getElementById("btn-copy-all-1000").onclick = () => {
    let allNames = state.accounts1000.map(acc => acc.name || "").join("\n");
    navigator.clipboard.writeText(allNames).then(() => alert("Đã copy toàn bộ tên của 1000 account!"));
};

document.getElementById("btn-reset-1000").onclick = () => {
    let newAccs = state.accounts1000.map(a => ({...a, checked: false}));
    update(hubRef, {accounts1000: newAccs});
};

document.getElementById("btn-copy-pwd").onclick = () => navigator.clipboard.writeText(pwd.value);
pwd.oninput = () => update(hubRef, {pwd: pwd.value});
note.oninput = () => update(hubRef, {note: note.value});
</script>
</body>
</html>
